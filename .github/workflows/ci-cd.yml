name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      testflight:
        description: "Upload the iOS build to TestFlight (needs iOS secrets)"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  android:
    name: Android (APK + AAB)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach APK to GitHub Releases on tags
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Generate missing platform files
        run: ./scripts/bootstrap_platforms.sh
      - name: Configure release signing
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
      - name: Warn about debug signing
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: echo "::warning::ANDROID_KEYSTORE_BASE64 not set - release builds are signed with the debug key (fine for sideloading, not for Google Play)."
      - run: flutter pub get
      - run: flutter build apk --release --build-number=${{ github.run_number }}
      - run: flutter build appbundle --release --build-number=${{ github.run_number }}
      - name: Rename outputs
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/SshMagic-${{ github.run_number }}.apk
          cp build/app/outputs/bundle/release/app-release.aab dist/SshMagic-${{ github.run_number }}.aab
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: dist/*
          if-no-files-found: error
      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk

  ios:
    name: iOS (IPA / TestFlight)
    needs: test
    runs-on: macos-15
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
      IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Generate missing platform files
        run: ./scripts/bootstrap_platforms.sh
      - run: flutter pub get

      - name: Decide signed or unsigned build
        id: mode
        run: |
          signed=false
          if [ -n "$APPLE_TEAM_ID" ] && [ -n "$ASC_KEY_ID" ] && [ -n "$IOS_DIST_CERT_P12_BASE64" ]; then
            if [ "${{ github.event_name }}" = "push" ] || \
               { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.testflight }}" = "true" ]; }; then
              signed=true
            fi
          fi
          echo "signed=$signed" >> "$GITHUB_OUTPUT"
          echo "Signed TestFlight build: $signed"

      # Unsigned build: proves the app compiles and produces an IPA that
      # AltStore / Sideloadly can re-sign with a free Apple ID.
      - name: Build unsigned IPA
        if: steps.mode.outputs.signed != 'true'
        run: |
          flutter build ios --release --no-codesign --build-number=${{ github.run_number }}
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/
          (cd dist && zip -qry SshMagic-${{ github.run_number }}-unsigned.ipa Payload && rm -rf Payload)
      - uses: actions/upload-artifact@v4
        if: steps.mode.outputs.signed != 'true'
        with:
          name: ios-unsigned
          path: dist/*.ipa
          if-no-files-found: error

      - uses: ruby/setup-ruby@v1
        if: steps.mode.outputs.signed == 'true'
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Build signed IPA and upload to TestFlight
        if: steps.mode.outputs.signed == 'true'
        run: |
          export IOS_DIST_CERT_PATH="$RUNNER_TEMP/dist_cert.p12"
          echo "$IOS_DIST_CERT_P12_BASE64" | base64 --decode > "$IOS_DIST_CERT_PATH"
          bundle exec fastlane ios beta
      - uses: actions/upload-artifact@v4
        if: steps.mode.outputs.signed == 'true'
        with:
          name: ios-appstore
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
